[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudcover-nawder"
version = "0.2.8"
description = "Current cloud cover at your location"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "plotext>=6.0",
]

[project.scripts]
cloudcover = "cloudcover:main"

[tool.hatch.envs.default]
dependencies = ["pytest", "ruff"]

[tool.hatch.envs.default.scripts]
check = [
    "ruff check src tests",
    "pytest -q",
]