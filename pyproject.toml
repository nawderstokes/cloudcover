[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudcover-nawder"
version = "0.1.1"
description = "Current cloud cover at your location"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.scripts]
cloudcover = "cloudcover:main"